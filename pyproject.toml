[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-graphics"
version = "0.3.0"
description = "Draws banners, section icons and pictures for Markdown files from small descriptions, in light and dark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Walter" }]
requires-python = ">=3.13"
dependencies = ["console-look @ git+https://github.com/Robertwlt03/console-look@v0.1.0"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]

[project.urls]
Repository = "https://github.com/Robertwlt03/markdown-graphics"

[project.scripts]
markdown-graphics = "markdown_graphics.__main__:main"
